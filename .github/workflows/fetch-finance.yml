name: Fetch Finance & Trade Data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
# A run that overlaps the next day's (e.g. after a long API stall) corrupts the
# commit->rebase->push dance; queue instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Run finance fetcher
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python fetch_finance.py
      - name: Save data
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add data/members.json data/details/ data/stats.json
          git diff --staged --quiet || git commit -m "Update finance data and anomaly scores [$(date +%Y-%m-%d)]"
          git pull --rebase origin main
          git push
