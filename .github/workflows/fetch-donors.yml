name: Fetch FEC Donor Data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run FEC donor fetcher
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python fetch_donors.py
      - name: Save data
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add data/details/
          git diff --staged --quiet || git commit -m "Update FEC donor data [$(date +%Y-%m-%d)]"
          git pull --rebase --autostash origin main
          git push
