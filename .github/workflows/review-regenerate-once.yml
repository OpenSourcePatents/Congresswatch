name: One-shot review data regeneration
on:
  push:
    branches: ['overhaul/source-review-2026-11-16']
    paths: ['.github/workflows/review-regenerate-once.yml']
permissions:
  contents: read
concurrency:
  group: review-offline-regeneration-2026-11-16
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'OpenSourcePatents/Congresswatch' && github.ref == 'refs/heads/overhaul/source-review-2026-11-16'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install scorer import dependency
        run: pip install requests
      - name: Reconcile pinned bill refresh into review only
        run: |
          set -eu
          git config user.name "CongressWatch review bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ba7ccb7755d9403409bf184de8ec11481ebf43fb
          git merge --no-commit --no-ff ba7ccb7755d9403409bf184de8ec11481ebf43fb || test -f .git/MERGE_HEAD
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          baseline = '9cf6b1636ce93bdcb0894a136eb0e3483f19a39b'
          incoming = 'ba7ccb7755d9403409bf184de8ec11481ebf43fb'
          changed = subprocess.check_output(['git','diff','--name-only',baseline,incoming],text=True).splitlines()
          assert len(changed)==539
          for path in changed:
              assert path.startswith('data/details/') and path.endswith('.json')
              old=json.loads(subprocess.check_output(['git','show',baseline+':'+path]))
              new=json.loads(subprocess.check_output(['git','show',incoming+':'+path]))
              ours=json.loads(subprocess.check_output(['git','show','HEAD:'+path]))
              assert {k for k in set(old)|set(new) if old.get(k)!=new.get(k)} <= {'bills','bills_updated'}, path
              assert ours.get('bills')==old.get('bills'), 'Review bill data diverged: '+path
              assert [b['bill_id'] for b in old.get('bills',[])] == [b['bill_id'] for b in new.get('bills',[])], 'Bill identity/order changed: '+path
              for a,b in zip(old.get('bills',[]),new.get('bills',[])):
                  assert {k for k in set(a)|set(b) if a.get(k)!=b.get(k)} <= {'alec_best_similarity','similar_member_bills','match_type','cosponsors'}, path
              ours['bills']=new['bills']
              ours['bills_updated']=new['bills_updated']
              Path(path).write_text(json.dumps(ours,indent=2))
          subprocess.run(['git','add','data/details/'],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).strip()
          print('Validated bill refresh applied: same bill IDs/order, no records removed; unrelated data preserved.')
          PY
      - name: Regenerate offline and audit all members
        run: |
          python recompute_scores.py
          python build_aggregates.py
          python audit_data.py > /tmp/review-data-audit.json
      - name: Verify exact reviewed data (timestamps excluded)
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          members = json.loads(Path("data/members.json").read_text())
          paths = sorted(["data/members.json", "data/stats.json", "data/trades.json", "data/bills.json"] + [f"data/details/{m['id']}.json" for m in members])
          def normalize(value):
              if isinstance(value, dict):
                  return {k: normalize(v) for k, v in value.items() if k not in ("score_updated", "last_updated")}
              if isinstance(value, list):
                  return [normalize(v) for v in value]
              return value
          digest = hashlib.sha256()
          for path in paths:
              digest.update((path + "\n").encode())
              digest.update(json.dumps(normalize(json.loads(Path(path).read_text())), sort_keys=True, separators=(",", ":")).encode())
              digest.update(b"\n")
          actual = digest.hexdigest()
          expected = "09e5ba9397ed32d93b04d50386095e9166fe366a68701e9f78443adab26130af"
          print(f"Verified files: {len(paths)}; normalized SHA256: {actual}")
          assert len(paths) == 543 and actual == expected, "Generated data differs from reviewed local output; refusing publication"
          Path("SOURCE_ONLY_REVIEW.md").write_text("# Review branch: source and regenerated data\n\nThe initially source-only branch now includes offline regenerated member scores and aggregates. All 543 current-member/aggregate JSON documents matched the reviewed local output after excluding only generated score_updated/last_updated timestamps. audit_data.py passed.\n\nPinned main source refreshes through ba7ccb7755d9403409bf184de8ec11481ebf43fb are reconciled: House travel freshness and bill analysis/cosponsor updates, no bill IDs or unrelated source records lost. This remains an unmerged review branch, not a production deployment. Coordinate OSP-API scoring compatibility and unresolved source-coverage gaps before deployment. No external source refresh, database migration or deployment was performed.\n\nRollback baseline: b9e5ac11ed0a3bae72353735c234b6fd5a19a3a7 (backup/pre-overhaul-2026-11-16).\n")
          log = Path("changelog/2026-11-16-session-1.md")
          text = log.read_text()
          prefix = "> SOURCE-ONLY REVIEW: regenerated data described below is in the full artifact, NOT this branch. See SOURCE_ONLY_REVIEW.md. Do not deploy this branch alone.\n\n"
          if text.startswith(prefix):
              text = text[len(prefix):]
          log.write_text("> Offline regenerated data is now included on this review branch and matched the reviewed local digest. No merge or production deployment performed.\n\n" + text)
          PY
      - name: Commit only reviewed data to the exact review ref
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          test "$GITHUB_REF" = "refs/heads/overhaul/source-review-2026-11-16"
          remote_head="$(git ls-remote origin refs/heads/overhaul/source-review-2026-11-16 | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name "CongressWatch review bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/details/ data/members.json data/stats.json data/trades.json data/bills.json SOURCE_ONLY_REVIEW.md changelog/2026-11-16-session-1.md
          git diff --cached --check
          git commit -m "Reconcile pinned bill refresh into review [skip ci]"
          git push origin HEAD:refs/heads/overhaul/source-review-2026-11-16
