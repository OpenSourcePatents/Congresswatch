name: Fetch House Foreign Travel
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Run gift travel fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python fetch_travel_pdf.py
      - name: Save data
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add data/members.json data/details/
          git diff --staged --quiet || git commit -m "Update House travel data [$(date +%Y-%m-%d)]"
          git pull --rebase origin main
          git push
