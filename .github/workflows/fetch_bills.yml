name: Fetch Bill Similarity Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

# Share the writer lock with finalize; all other main changes are handled
# by the pin check and the server-side normal fast-forward push.
concurrency:
  group: congresswatch-bill-and-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      BASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Confirm checkout still matches main
        run: |
          git fetch --no-tags --depth 1 origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
      - name: Install dependencies
        run: python -m pip install -r requirements-official-prose.txt
      - name: Build and audit the complete source and member snapshot
        run: python refresh_official_bills.py --expected-head "$BASE" --out "$RUNNER_TEMP/official-bill-refresh"
      - name: Publish only the verified fast-forward snapshot
        run: |
          git fetch --no-tags --depth 1 origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$BASE"
          python refresh_official_bills.py --expected-head "$BASE" --out "$RUNNER_TEMP/official-bill-refresh" --install
          git add -- data/details/ data/members.json data/stats.json data/trades.json data/bills.json data/bill_refresh_manifest.json data/bill_refresh_catalog.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git -c user.name="Congresswatch bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh verified official bill similarity data"
          # No pull, rebase, force or alternate destination. Concurrent writes
          # after the pin check are rejected by Git; do not publish stale data.
          git push origin HEAD:refs/heads/main
