name: Fetch Bill Similarity Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests scikit-learn numpy

      - name: Restore bills cache
        uses: actions/cache@v4
        with:
          path: data/bills/all_bills.json
          key: bills-cache-${{ github.run_number }}
          restore-keys: |
            bills-cache-

      - name: Run bill similarity engine
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: python run_fetch_bills.py

      - name: Save data
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add data/details/
          git diff --staged --quiet || git commit -m "Update bill similarity data"
          git pull --rebase origin main
          git push