name: Reconcile pinned attempts (review branch only)
on:
  push:
    branches: [overhaul/source-review-2026-11-16]
    paths: [.github/workflows/reconcile-reviewed-attempts.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'OpenSourcePatents/Congresswatch' && github.ref == 'refs/heads/overhaul/source-review-2026-11-16'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconcile only the pinned review branch
        run: python validation/publish_nov24_reconciliation.py
