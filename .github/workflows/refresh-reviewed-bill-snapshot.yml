name: Refresh pinned bill snapshot (review branch only)
on:
  push:
    branches: [overhaul/source-review-2026-11-16]
    paths: [.github/workflows/refresh-reviewed-bill-snapshot.yml]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'OpenSourcePatents/Congresswatch' && github.ref == 'refs/heads/overhaul/source-review-2026-11-16'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-official-prose.txt
      - name: Audit and update only the pinned review branch
        run: python validation/refresh_reviewed_snapshot.py
