name: Bootstrap
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python bootstrap.py
      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add .github/workflows/ data/
          git diff --staged --quiet || git commit -m "bootstrap workflows and data dirs"
          git push
