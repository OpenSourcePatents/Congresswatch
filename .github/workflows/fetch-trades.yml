name: Fetch Senate Stock Trades
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Run Senate eFD scraper
        run: python fetch_senate_efd.py
      - name: Save data
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add data/members.json data/details/
          git diff --staged --quiet || git commit -m "Update Senate trade data [$(date +%Y-%m-%d)]"
          git pull --rebase origin main
          git push
