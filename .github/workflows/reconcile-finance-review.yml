name: Reconcile bounded finance review only
on:
  push:
    branches: [overhaul/source-review-2026-11-16]
    paths: [.github/workflows/reconcile-finance-review.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-official-prose.txt beautifulsoup4
      - name: Audit exact tree and update only pinned review branch
        run: python validation/transport_finance_review.py
